
services:
  - type: web
    name: inkloom-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: INKLOOM_JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_ENDPOINT
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
