# ==========================================
# INKLOOM AI - Spring Boot Application Config
# ==========================================
server.port=${PORT:8080}

# Spring Application
spring.application.name=inkloom-backend

# MySQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inkloom_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root@2007}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Inkloom Security & AI Settings
inkloom.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
inkloom.jwt.expiration-ms=86400000
inkloom.ai.api-key=${OPENAI_API_KEY:}
inkloom.ai.endpoint=${AI_ENDPOINT:https://api.openai.com/v1}
inkloom.ai.model=${AI_MODEL:gpt-4o-mini}

# Logging
logging.level.ai.inkloom=INFO
logging.level.org.springframework.security=WARN
