# ==========================================
# INKLOOM AI - Spring Boot Application Config
# ==========================================

server.port=${PORT:8080}

# Spring Application
spring.application.name=inkloom-backend

# MySQL Datasource Configuration - Aiven
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-2da7b46d-keerthowda714-d6df.h.aivencloud.com:18398/defaultdb?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Inkloom Security
inkloom.jwt.secret=${INKLOOM_JWT_SECRET}
inkloom.jwt.expiration-ms=86400000

# Inkloom AI Settings
inkloom.ai.api-key=${OPENAI_API_KEY:}
inkloom.ai.endpoint=${AI_ENDPOINT:https://api.openai.com/v1}
inkloom.ai.model=${AI_MODEL:gpt-4o-mini}

# Logging
logging.level.ai.inkloom=INFO
logging.level.org.springframework.security=WARN
